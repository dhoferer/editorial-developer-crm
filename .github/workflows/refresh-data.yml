name: Refresh IAE & Nominations

# ⚠️ PAUSIERT (siehe Kommentar unten) — NICHT wieder aktivieren, bevor das Skript
# auf die neue Huxley GraphQL-API (huxley.itunes.apple.com/api-web/v4/search/services)
# umgestellt ist. Das alte Playwright-Scroll-Scraping (scripts/fetch_editorial_data.py)
# liefert nur ~30 dünne Nominations-Items und hat bereits einmal die reichhaltigen
# 160-Item-GraphQL-Daten in data/nominations.json überschrieben.
#
# "Knopfdruck"-Trigger: manuell im GitHub UI unter Actions > Refresh IAE & Nominations > Run workflow
# Automatischer täglicher Cron ist ausgeschaltet, bis die Umstellung fertig ist.
on:
  workflow_dispatch:
    inputs:
      storefront:
        description: "Huxley storefront ID (z.B. 143443 = Germany)"
        required: false
        default: "143443"
  # schedule:
  #   - cron: "0 5 * * *"   # täglich 05:00 UTC — DEAKTIVIERT, siehe Hinweis oben

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Nominations & IAE from Huxley
        env:
          HUXLEY_STOREFRONT: ${{ github.event.inputs.storefront || '143443' }}
        run: |
          python3 scripts/fetch_editorial_data.py

      - name: Commit updated data
        run: |
          git config user.name "editorial-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nominations.json data/iae.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh IAE & Nominations [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push failed (attempt $i), retrying after rebase..."
            sleep $((RANDOM % 5 + 2))
          done
